<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
    <defs>
        <!-- Radial glow of the globe -->
        <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00cec9" stop-opacity="0.2"/>
            <stop offset="60%" stop-color="#0a192f" stop-opacity="0"/>
        </radialGradient>
        <!-- Blue-purple gradient for the grid lines -->
        <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00cec9" stop-opacity="0.35"/>
            <stop offset="40%" stop-color="#a29bfe" stop-opacity="0.2"/>
            <stop offset="80%" stop-color="#00cec9" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#0984e3" stop-opacity="0.02"/>
        </linearGradient>
        <!-- Drop shadow for nodes -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background glow element -->
    <circle cx="400" cy="400" r="380" fill="url(#globeGlow)" />

    <!-- Outer Boundary Circles -->
    <circle cx="400" cy="400" r="320" fill="none" stroke="url(#gridGrad)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.6" />
    <circle cx="400" cy="400" r="300" fill="none" stroke="url(#gridGrad)" stroke-width="2" />

    <!-- Latitudes (Horizontal Ellipses) -->
    <ellipse cx="400" cy="400" rx="300" ry="75" fill="none" stroke="url(#gridGrad)" stroke-width="1" />
    <ellipse cx="400" cy="400" rx="280" ry="150" fill="none" stroke="url(#gridGrad)" stroke-width="1.2" />
    <ellipse cx="400" cy="400" rx="230" ry="225" fill="none" stroke="url(#gridGrad)" stroke-width="1" />
    <ellipse cx="400" cy="400" rx="140" ry="275" fill="none" stroke="url(#gridGrad)" stroke-width="0.8" />

    <!-- Longitudes (Vertical Ellipses) -->
    <ellipse cx="400" cy="400" rx="75" ry="300" fill="none" stroke="url(#gridGrad)" stroke-width="1" />
    <ellipse cx="400" cy="400" rx="150" ry="290" fill="none" stroke="url(#gridGrad)" stroke-width="1.2" />
    <ellipse cx="400" cy="400" rx="225" ry="260" fill="none" stroke="url(#gridGrad)" stroke-width="1" />

    <!-- Center Axes -->
    <line x1="100" y1="400" x2="700" y2="400" stroke="url(#gridGrad)" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="400" y1="100" x2="400" y2="700" stroke="url(#gridGrad)" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Network Connections (Lines) -->
    <g stroke="#00cec9" stroke-width="0.8" opacity="0.4">
        <!-- Northern hemisphere connections -->
        <line x1="400" y1="175" x2="475" y2="250" />
        <line x1="475" y1="250" x2="525" y2="290" />
        <line x1="325" y1="250" x2="400" y2="225" />
        <line x1="325" y1="250" x2="400" y2="175" />
        
        <!-- Equator and middle connections -->
        <line x1="250" y1="350" x2="325" y2="400" />
        <line x1="325" y1="400" x2="400" y2="325" />
        <line x1="400" y1="325" x2="475" y2="400" />
        <line x1="475" y1="400" x2="550" y2="350" />
        
        <!-- Southern hemisphere connections -->
        <line x1="325" y1="400" x2="400" y2="475" />
        <line x1="400" y1="475" x2="475" y2="400" />
        <line x1="400" y1="475" x2="400" y2="575" />
        <line x1="250" y1="450" x2="325" y2="500" />
        <line x1="475" y1="500" x2="550" y2="450" />
    </g>

    <!-- Secondary connections in purple -->
    <g stroke="#a29bfe" stroke-width="0.8" opacity="0.35">
        <line x1="400" y1="225" x2="475" y2="250" />
        <line x1="325" y1="400" x2="250" y2="450" />
        <line x1="475" y1="400" x2="550" y2="450" />
        <line x1="400" y1="475" x2="475" y2="500" />
    </g>

    <!-- Cyan Glowing Nodes -->
    <g fill="#00cec9">
        <circle cx="400" cy="175" r="4.5" filter="url(#glow)" />
        <circle cx="475" cy="250" r="5" filter="url(#glow)" />
        <circle cx="525" cy="290" r="3.5" filter="url(#glow)" />
        <circle cx="325" cy="250" r="4" filter="url(#glow)" />
        <circle cx="400" cy="225" r="5" filter="url(#glow)" />
        <circle cx="250" cy="350" r="4" filter="url(#glow)" />
        <circle cx="325" cy="400" r="6" filter="url(#glow)" />
        <circle cx="400" cy="325" r="4" filter="url(#glow)" />
        <circle cx="475" cy="400" r="5.5" filter="url(#glow)" />
        <circle cx="550" cy="350" r="4" filter="url(#glow)" />
        <circle cx="400" cy="475" r="5" filter="url(#glow)" />
        <circle cx="400" cy="575" r="4.5" filter="url(#glow)" />
        <circle cx="250" cy="450" r="4" filter="url(#glow)" />
        <circle cx="325" cy="500" r="3.5" filter="url(#glow)" />
        <circle cx="475" cy="500" r="4" filter="url(#glow)" />
        <circle cx="550" cy="450" r="4.5" filter="url(#glow)" />
    </g>

    <!-- Purple Accent Glowing Nodes -->
    <g fill="#a29bfe">
        <circle cx="310" cy="185" r="4" filter="url(#glow)" />
        <circle cx="490" cy="185" r="3.5" filter="url(#glow)" />
        <circle cx="590" cy="400" r="4" filter="url(#glow)" />
        <circle cx="210" cy="400" r="4" filter="url(#glow)" />
        <circle cx="310" cy="600" r="3.5" filter="url(#glow)" />
        <circle cx="490" cy="600" r="4" filter="url(#glow)" />
    </g>
</svg>
